<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flat 3B · Hilly Plains</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ddd5c2; --ink:#2b2721; --muted:#6b6352; --stain:rgba(110,86,52,.18); --rule:#b3a88f;
  --btn:#2b2721; --btn-ink:#ddd5c2; --veil:rgba(6,6,5,.6);
  --hud:#d9d3c3; --hud-dim:rgba(217,211,195,.45); --hud-bg:rgba(20,20,18,.45); --stage:#000;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1d1b17; --ink:#d8d0bd; --muted:#948a76; --stain:rgba(150,120,80,.12); --rule:#3c382f;
    --btn:#d8d0bd; --btn-ink:#1d1b17; --veil:rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1d1b17; --ink:#d8d0bd; --muted:#948a76; --stain:rgba(150,120,80,.12); --rule:#3c382f;
  --btn:#d8d0bd; --btn-ink:#1d1b17; --veil:rgba(0,0,0,.7);
  color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;overflow:hidden;background:var(--stage);
  font-family:'Special Elite','Courier New',Courier,monospace;
  -webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;pointer-events:none}
#cross{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:var(--hud-dim);transition:transform .15s}
#cross.on{background:var(--hud);transform:scale(1.8)}
#prompt{position:absolute;left:0;right:0;top:calc(50% + 20px);text-align:center;color:var(--hud);font-size:15px;text-shadow:0 1px 3px #000;opacity:0;transition:opacity .2s}
#say{position:absolute;left:8%;right:8%;bottom:calc(10% + env(safe-area-inset-bottom,0px));text-align:center;color:var(--hud);
  font-size:clamp(15px,2.3vw,20px);line-height:1.5;text-shadow:0 1px 4px #000;opacity:0;transition:opacity .7s;max-width:38em;margin:0 auto}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--veil);
  padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
#ov.hide{display:none}
.card{position:relative;background:var(--paper);color:var(--ink);max-width:24em;padding:30px 30px 26px;
  box-shadow:0 24px 70px rgba(0,0,0,.65);transform:rotate(-.7deg)}
.card::after{content:"";position:absolute;right:22px;top:18px;width:84px;height:84px;border-radius:50%;
  background:radial-gradient(circle,transparent 55%,var(--stain) 62%,transparent 70%);pointer-events:none}
.card h1{margin:0 0 14px;font-weight:400;font-size:34px;letter-spacing:.04em}
.card p{margin:0 0 14px;line-height:1.55;font-size:16px}
#ctrl{color:var(--muted);font-size:14px;border-top:1px dashed var(--rule);padding-top:14px;margin-bottom:12px}
#modes{display:flex;flex-direction:column;gap:10px;margin:0 0 18px;font-size:14px}
#modes label{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--ink)}
#modes select,#modes .seg{font:inherit;font-size:13px;background:transparent;color:var(--ink);border:1px solid var(--rule);border-radius:4px;padding:4px 8px;max-width:11em}
#modes .seg{display:flex;padding:0;overflow:hidden}
#modes .seg button{flex:1;font:inherit;font-size:12px;background:transparent;color:var(--muted);border:0;padding:6px 4px;cursor:pointer}
#modes .seg button.on{background:var(--btn);color:var(--btn-ink)}
#go{font:inherit;font-size:17px;background:var(--btn);color:var(--btn-ink);border:0;padding:12px 28px;cursor:pointer;width:100%}
#go:focus-visible{outline:2px dashed var(--ink);outline-offset:4px}
#stick{position:fixed;width:100px;height:100px;margin:-50px 0 0 -50px;border-radius:50%;border:1px solid var(--hud-dim);background:var(--hud-bg);display:none;pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:var(--hud-dim)}
#tbtns{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:none;grid-template-columns:repeat(2,58px);gap:10px}
#inv{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));color:var(--hud);font-size:13px;text-shadow:0 1px 3px #000;opacity:.85}
.lb{position:fixed;left:0;right:0;height:0;background:#000;pointer-events:none;transition:height .8s ease;z-index:4}
#lbT{top:0}#lbB{bottom:0}
#bag{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:var(--veil);padding:20px;z-index:15}
#bag.show{display:flex}
#bag .card{max-width:22em;width:100%}
#bag h1{font-size:26px;margin-bottom:12px}
#bagItems{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.bagI{font:inherit;text-align:left;background:transparent;color:var(--ink);border:1px solid var(--rule);padding:9px 12px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.bagI b{font-weight:400;font-size:16px}.bagI span{font-size:12px;color:var(--muted)}
.bagI.on{background:var(--btn);color:var(--btn-ink)}.bagI.on span{color:var(--btn-ink);opacity:.8}
#bagCount{font-size:13px;color:var(--muted);margin:0 0 12px}
#bagClose{font:inherit;font-size:15px;background:var(--btn);color:var(--btn-ink);border:0;padding:10px 20px;cursor:pointer;width:100%}
#tbtns button{font:inherit;font-size:13px;color:var(--hud);background:var(--hud-bg);border:1px solid var(--hud-dim);border-radius:50%;width:58px;height:58px;padding:0;line-height:1.1}
#tbtns button.on{background:var(--hud);color:#1a1814;border-color:var(--hud)}
#pause{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:var(--veil);
  padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:20}
#pause.show{display:flex}
#pause .card{max-width:18em;text-align:center}
#pause .card h1{font-size:28px;margin-bottom:8px}
#pause .card p{margin-bottom:18px;color:var(--muted);font-size:14px}
#pause .btns{display:flex;flex-direction:column;gap:10px}
#pause .btns button{font:inherit;font-size:16px;background:var(--btn);color:var(--btn-ink);border:0;padding:11px 20px;cursor:pointer}
#pause .btns button.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule)}
#bPause{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));
  font:inherit;font-size:13px;color:var(--hud);background:var(--hud-bg);border:1px solid var(--hud-dim);border-radius:50%;
  width:48px;height:48px;padding:0;display:none;z-index:5;line-height:1}
@media (prefers-reduced-motion: reduce){#say,#prompt,#cross{transition:none}}
</style>
</head>
<body>
<div id="hud"><div id="cross"></div><div id="prompt"></div><div id="say"></div><div id="inv"></div></div>
<div id="bag"><div class="card"><h1>Bag</h1><div id="bagItems"></div><p id="bagCount"></p><button id="bagClose" type="button">Close</button></div></div>
<div id="lbT" class="lb"></div><div id="lbB" class="lb"></div>
<div id="stick"><div id="knob"></div></div>
<div id="tbtns">
  <button id="bCrouch" type="button">Crouch</button>
  <button id="bTorch" type="button">Light</button>
  <button id="bUse" type="button">Use</button>
  <button id="bTool" type="button">Tool</button>
  <button id="bTip" type="button">Tip</button>
  <button id="bBuild" type="button">Cart</button>
  <button id="bDrop" type="button">Drop</button>
  <button id="bBag" type="button">Bag</button>
</div>
<button id="bPause" type="button" aria-label="Pause">II</button>
<div id="pause">
  <div class="card">
    <h1>Paused</h1>
    <p>The flat holds its breath.</p>
    <div class="btns">
      <button id="bResume" type="button">Resume</button>
      <button id="bQuit" type="button" class="ghost">Quit to door</button>
    </div>
  </div>
</div>
<div id="ov"><div class="card">
  <h1>Flat 3B</h1>
  <p id="lede">Ground floor. The radiator ticks. The windows look out onto the hills now.</p>
  <div id="modes">
    <label>Graphics
      <div class="seg" id="gfxSeg">
        <button type="button" data-v="low">Low</button>
        <button type="button" data-v="med" class="on">Med</button>
        <button type="button" data-v="high">High</button>
        <button type="button" data-v="4k">4K</button>
      </div>
    </label>
    <label>Look
      <div class="seg" id="lookSeg">
        <button type="button" data-v="smooth" class="on">Smooth</button>
        <button type="button" data-v="raw">Raw</button>
      </div>
    </label>
    <label>Sound
      <div class="seg" id="sndSeg">
        <button type="button" data-v="on" class="on">On</button>
        <button type="button" data-v="off">Off</button>
      </div>
    </label>
    <label>Detail
      <div class="seg" id="detSeg">
        <button type="button" data-v="minimal">Minimal</button>
        <button type="button" data-v="full" class="on">Full</button>
      </div>
    </label>
    <label>Walk pace
      <div class="seg" id="paceSeg">
        <button type="button" data-v="slow">Slow</button>
        <button type="button" data-v="norm" class="on">Normal</button>
        <button type="button" data-v="fast">Fast</button>
      </div>
    </label>
  </div>
  <p id="ctrl">Building the flat…</p>
  <button id="go" type="button">Go inside</button>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const fail = m => { const p = $('ctrl'); if (p) p.textContent = 'The flat failed to load: ' + m + '. Reload the page to try again.'; };
window.addEventListener('error', e => fail(e.message));
if (!window.THREE) { fail('the 3D library didn’t download'); return; }

const PI = Math.PI;
const isTouch = matchMedia('(pointer: coarse)').matches;
let seed = 91731;
const R = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const RR = (a, b) => a + R() * (b - a);
const C = h => new THREE.Color(h).convertSRGBToLinear();

/* ================= renderer ================= */
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.shadowMap.autoUpdate = false;
renderer.domElement.id = 'game';
document.body.prepend(renderer.domElement);
const cvs = renderer.domElement;
const SHADOW = isTouch ? 256 : 512;

const scene = new THREE.Scene();
const FOG = C('#9ea8ae');
scene.background = FOG.clone();
scene.fog = new THREE.FogExp2(FOG, 0.032);
const camera = new THREE.PerspectiveCamera(68, innerWidth / innerHeight, 0.04, 420);
camera.rotation.order = 'YXZ';
scene.add(camera);

/* PSX vertex snapping (wobble) for outdoor materials; grid follows render resolution */
const snapU = { value: new THREE.Vector2(240, 135) };
const snap = m => {
  m.onBeforeCompile = s => {
    s.uniforms.uSnap = snapU;
    s.vertexShader = s.vertexShader
      .replace('#include <common>', '#include <common>\nuniform vec2 uSnap;')
      .replace('#include <project_vertex>', '#include <project_vertex>\n gl_Position.xy = floor(gl_Position.xy / gl_Position.w * uSnap + .5) / uSnap * gl_Position.w;');
  };
  return m;
};

/* settling snow: one shared uniform grows while it snows; outdoor materials whiten where it lands */
const snowAcc = { value: .12 };
function snowy(m, col, mode) {   // mode 0: upward faces, 1: clinging (foliage, no normals), 2: dusting (grass), 3: ground (mud resists)
  const prev = m.onBeforeCompile, sc = { value: col };
  m.onBeforeCompile = (s, r) => {
    prev.call(m, s, r);
    s.uniforms.uSnowAcc = snowAcc; s.uniforms.uSnowCol = sc;
    s.vertexShader = s.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vSnW; varying float vSnUp;')
      .replace('#include <project_vertex>', '#include <project_vertex>\n vec4 snWP = vec4(transformed, 1.0); vec3 snN = ' + (mode === 1 || mode === 2 ? 'vec3(0.0, 1.0, 0.0)' : 'normal') + ';\n#ifdef USE_INSTANCING\n snWP = instanceMatrix * snWP; snN = mat3(instanceMatrix) * snN;\n#endif\n snWP = modelMatrix * snWP; vSnW = snWP.xyz; vSnUp = normalize(mat3(modelMatrix) * snN).y;');
    s.fragmentShader = s.fragmentShader.replace('#include <common>', '#include <common>\nuniform float uSnowAcc; uniform vec3 uSnowCol; varying vec3 vSnW; varying float vSnUp;\n'
      + 'float snH(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }\n'
      + 'float snV(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f); return mix(mix(snH(i), snH(i + vec2(1.0, 0.0)), f.x), mix(snH(i + vec2(0.0, 1.0)), snH(i + vec2(1.0, 1.0)), f.x), f.y); }')
      .replace('#include <color_fragment>', '#include <color_fragment>\n { vec2 q = floor((vSnW.xz + vSnW.y * .7) * 6.0) / 6.0; float n = snV(q * .55) * .6 + snV(q * 2.1 + 7.0) * .4;\n'
      + '   float a = uSnowAcc * ' + ['smoothstep(.5, .95, vSnUp)', '.42', '.5', 'smoothstep(.5, .95, vSnUp) * mix(.6, 1.0, smoothstep(.06, .2, dot(diffuseColor.rgb, vec3(.333))))'][mode] + ';\n'
      + '   diffuseColor.rgb = mix(diffuseColor.rgb, uSnowCol, smoothstep(n - .12, n + .12, a)); }');
  };
  return m;
}

/* ================= procedural textures ================= */
function cv(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const ctx = c => c.getContext('2d');
function noise(g, W, H, cx, cy, a, op) {
  const c = cv(cx, cy), x = ctx(c), d = x.createImageData(cx, cy);
  for (let i = 0; i < cx * cy; i++) { const v = (R() * 255) | 0; d.data[i*4] = v; d.data[i*4+1] = v; d.data[i*4+2] = v; d.data[i*4+3] = 255; }
  x.putImageData(d, 0, 0);
  g.save(); g.globalAlpha = a; g.globalCompositeOperation = op || 'overlay'; g.imageSmoothingEnabled = true;
  g.drawImage(c, 0, 0, W, H); g.restore();
}
function specks(g, W, H, n, col, sz, amax) {
  g.save(); g.fillStyle = col;
  for (let i = 0; i < n; i++) { const s = RR(sz * .4, sz); g.globalAlpha = RR(.04, amax || .3); g.fillRect(R() * W, R() * H, s, s); }
  g.restore();
}
function blot(g, x, y, r, col, a) {
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, 'rgba(' + col + ',' + a + ')'); gr.addColorStop(1, 'rgba(' + col + ',0)');
  g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
}
function tex(c) { const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.encoding = THREE.sRGBEncoding; t.anisotropy = 4; return t; }

function plaster(base, stains, drips) {
  const W = 512, c = cv(W, W), g = ctx(c);
  g.fillStyle = base; g.fillRect(0, 0, W, W);
  noise(g, W, W, 5, 5, .5); noise(g, W, W, 14, 14, .38); noise(g, W, W, 48, 48, .26); noise(g, W, W, 160, 160, .22); noise(g, W, W, 512, 512, .18);
  for (let i = 0; i < stains; i++) blot(g, R() * W, R() * W, RR(25, 120), '72,60,40', RR(.07, .2));
  for (let i = 0; i < drips; i++) {
    const x = R() * W, l = RR(40, 260), w = RR(1, 5), gr = g.createLinearGradient(0, 0, 0, l);
    gr.addColorStop(0, 'rgba(58,48,34,.3)'); gr.addColorStop(1, 'rgba(58,48,34,0)'); g.fillStyle = gr; g.fillRect(x, 0, w, l);
  }
  let gr = g.createLinearGradient(0, W * .7, 0, W); gr.addColorStop(0, 'rgba(38,32,24,0)'); gr.addColorStop(1, 'rgba(38,32,24,.5)');
  g.fillStyle = gr; g.fillRect(0, W * .7, W, W * .3);
  gr = g.createLinearGradient(0, 0, 0, W * .18); gr.addColorStop(0, 'rgba(38,32,24,.38)'); gr.addColorStop(1, 'rgba(38,32,24,0)');
  g.fillStyle = gr; g.fillRect(0, 0, W, W * .18);
  specks(g, W, W, 1200, '#231d14', 2.5); specks(g, W, W, 400, '#b8b0a0', 2, .15);
  return tex(c);
}

function extPlasterT() {
  const W = 512, c = cv(W, W), g = ctx(c);
  g.fillStyle = '#b8b09e'; g.fillRect(0, 0, W, W);
  noise(g, W, W, 5, 5, .5); noise(g, W, W, 14, 14, .4); noise(g, W, W, 48, 48, .3);
  for (let i = 0; i < 25; i++) {
    const x = R() * W, y = R() * W, r = RR(20, 80);
    g.fillStyle = 'rgba(70,60,50,' + RR(.2, .5) + ')';
    g.beginPath();
    g.ellipse(x, y, r, r * RR(.5, 1), R() * Math.PI, 0, Math.PI * 2);
    g.fill();
  }
  g.strokeStyle = 'rgba(40,35,30,.4)'; g.lineWidth = 1.5;
  for (let i = 0; i < 15; i++) {
    let x = R() * W, y = R() * W;
    g.beginPath(); g.moveTo(x, y);
    for (let k = 0; k < 8; k++) { x += RR(-20, 20); y += RR(-20, 20); g.lineTo(x, y); }
    g.stroke();
  }
  for (let i = 0; i < 20; i++) blot(g, R() * W, R() * W, RR(30, 120), '60,50,35', RR(.15, .35));
  let gr = g.createLinearGradient(0, W * .6, 0, W);
  gr.addColorStop(0, 'rgba(40,35,25,0)'); gr.addColorStop(1, 'rgba(40,35,25,.6)');
  g.fillStyle = gr; g.fillRect(0, W * .6, W, W * .4);
  specks(g, W, W, 800, '#2a2420', 2, .4);
  return tex(c);
}

/* falu-red lap siding, 64px PSX texture covering 1.2 m: eight boards, shadow line under each lap, butt joints, weathering */
function cladT() {
  const W = 64, c = cv(W, W), g = ctx(c);
  for (let b = 0; b < 8; b++) {                                   // old paint gone grey-brown, bare wood showing
    const fade = RR(-10, 8), ph = R() * 9;
    for (let y = 0; y < 8; y++) for (let x = 0; x < W; x++) {
      const grain = Math.sin(x * .33 + ph + y * .9) * 5, edge = y === 7 ? -30 : y === 6 ? -9 : y === 0 ? 7 : 0, n = RR(-6, 6);
      g.fillStyle = 'rgb(' + (74 + fade + grain + edge + n | 0) + ',' + (66 + fade + grain * .8 + edge + n | 0) + ',' + (57 + fade * .8 + edge * .9 + n | 0) + ')';
      g.fillRect(x, b * 8 + y, 1, 1);
    }
    g.fillStyle = 'rgba(12,10,8,.7)'; g.fillRect(R() * W | 0, b * 8, 1, 7);
  }
  for (let i = 0; i < 14; i++) { const x = R() * W | 0, l = RR(10, 50) | 0; for (let y = 0; y < l; y++) { g.fillStyle = 'rgba(20,18,12,' + (.35 * (1 - y / l)).toFixed(2) + ')'; g.fillRect(x + (y > l / 2 ? 1 : 0), (R() * 8 | 0) * 8 + y & 63, 1, 1); } }   // drip streaks
  for (let i = 0; i < 9; i++) { const x = R() * W, y = R() * W, r = RR(3, 9); for (let k = 0; k < r * 6; k++) { g.fillStyle = 'rgba(38,48,28,' + RR(.15, .4).toFixed(2) + ')'; g.fillRect(x + RR(-r, r) & 63, y + RR(-r * .6, r * .6) & 63, 1, 1); } }   // mildew
  for (let i = 0; i < 30; i++) { g.fillStyle = 'rgba(150,140,120,' + RR(.08, .2).toFixed(2) + ')'; g.fillRect(R() * W | 0, R() * W | 0, RR(2, 6) | 0, 1); }   // last flakes of paint
  const t = tex(c); t.magFilter = THREE.NearestFilter; return t;
}

/* old lime plaster over brick, 128px covering 2.4 m: mottled grey-white, damp blooms, cracks, and
   patches where the render has fallen away to show the brick (with a dark lip of broken plaster) */
function stuccoT() {
  const W = 256, c = cv(W, W), g = ctx(c), px = (x, y, r, gg, b) => { g.fillStyle = 'rgb(' + (r | 0) + ',' + (gg | 0) + ',' + (b | 0) + ')'; g.fillRect(x & 255, y & 255, 1, 1); };
  for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) {
    const n = (Math.sin(x * .045 + y * .025 + Math.sin(y * .02) * 3) + Math.sin(x * .016 - y * .035) * 1.3) * 7 + RR(-10, 10) - Math.max(0, y - 170) * .25;
    px(x, y, 146 + n, 141 + n, 130 + n * .9);
  }
  for (let i = 0; i < 12; i++) {                                       // damp blooms
    const cx = R() * W, cy = R() * W, rr = RR(10, 26);

        part(blob(.043, .042, .055, 7, 5, fn), g, 0, .03, .165);
        part(blob(.016, .02, .055, 5, 4, solid(hx('#1c1c1e')), (v, x, y, z) => { const t = ss(-.6, 1, z); v.x *= 1 - .8 * t; v.y *= 1 - .7 * t; v.y -= .012 * t; }), g, 0, .022, .238);
        const shp = pts => { const s = new THREE.Shape(); s.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) s.lineTo(pts[i][0], pts[i][1]); const geo = new THREE.ShapeGeometry(s); geo.rotateX(Math.PI / 2); return geo; };
        // tail: (x, -forward) → after rotateX the shape's y runs fore/aft
        const tailPts = raven ? [[-.03, 0], [.03, 0], [.07, -.17], [0, -.22], [-.07, -.17]] : [[-.03, 0], [.03, 0], [.07, -.16], [.03, -.18], [-.03, -.18], [-.07, -.16]];
        part(shp(tailPts), g, 0, .005, -.14, 0, 0, 0, wingM);
        const span = raven ? 1 : .8, wings = [];
        for (const s of [-1, 1]) {
            const inner = piv(g, s * .045, .02, .03), mid = piv(inner, s * .24 * span, 0, 0);
            const arm = [[0, .07], [.24, .06], [.24, -.09], [0, -.1]].map(p => [s * p[0] * span, p[1]]);
            const hand = [[0, .06], [.18, .045], [.3, .0], [.26, -.02], [.31, -.035], [.25, -.05], [.29, -.07], [.22, -.075], [.24, -.095], [.14, -.095], [0, -.09]].map(p => [s * p[0] * span, p[1]]);
            part(shp(arm), inner, 0, 0, 0, 0, 0, 0, wingM);
            part(shp(hand), mid, 0, 0, 0, 0, 0, 0, wingM);
            wings.push({ inner, mid, s });
        }
        g.scale.setScalar(raven ? 1.1 : .85);
        g.userData.wings = wings;
        return g;
    }

    // ================================================================
    // SPAWN ENTITIES
    // ================================================================
    const bunnies = [];
    for (let i = 0; i < BUNNY_COUNT; i++) {
        const mesh = createHareMesh(Math.random() < .65); scene.add(mesh);
        const sp = safeSpawn(); mesh.position.set(sp.x, 0, sp.z); mesh.rotation.y = Math.random() * TAU; plant(mesh, .15);
        bunnies.push({ mesh, rig: mesh.userData.rig, state: 'feed', timer: 1 + Math.random() * 3, yaw: mesh.rotation.y, t: 0, dur: .4, dist: .5, lift: .12, chain: 0, phase: Math.random() * 9 });
    }

    const deer = [];
    for (let i = 0; i < DEER_COUNT; i++) {
        const mesh = createDeerMesh(.92 + Math.random() * .14, i === 0 || Math.random() < .35); scene.add(mesh);
        const sp = safeSpawn(); mesh.position.set(sp.x, 0, sp.z); mesh.rotation.y = Math.random() * TAU; plant(mesh, .55);
        deer.push({ mesh, rig: mesh.userData.rig, state: 'graze', timer: 3 + Math.random() * 6, target: new THREE.Vector3(sp.x, 0, sp.z),
            walkSpeed: .9 + Math.random() * .35, speed: 0, cyc: Math.random(), cool: 0, fleeYaw: 0, flick: 0, ear: 0, phase: Math.random() * 9 });
    }

    const birds = [];
    for (let i = 0; i < BIRD_COUNT; i++) {
        const raven = Math.random() < .4, mesh = createBirdMesh(raven); scene.add(mesh);
        const radius = 10 + Math.random() * 18, dir = Math.random() < .5 ? -1 : 1;
        birds.push({ mesh, raven, cx: bounds.x1 + Math.random() * (bounds.x2 - bounds.x1), cz: bounds.z1 + Math.random() * (bounds.z2 - bounds.z1),
            radius, height: 14 + Math.random() * 14, angle: Math.random() * TAU, w: dir * (raven ? 9 : 7.5 + Math.random() * 2) / radius,
            flapHz: raven ? 3.2 : 4.4, ph: Math.random() * TAU, glideT: Math.random() * 3, gliding: false, phase: Math.random() * TAU });
    }

    // ================================================================
    // UPDATE
    // ================================================================
    let elapsed = 0;
    const W_PH = [.25, .75, 0, .5], B_PH = [.5, .58, 0, .08];          // lateral-sequence walk; bounding gallop (fronts, then hinds)

    function deerRig(d, dt, neckT, headT) {
        const r = d.rig, sp = d.speed, bound = sp > 3.2;
        d.cyc += dt * sp / (bound ? 3.6 : 1.2);
        const amp = bound ? .8 : Math.min(.4, sp * .45), k = Math.min(1, dt * 14);
        r.legs.forEach((L, i) => {
            const th = TAU * (d.cyc + (bound ? B_PH[i] : W_PH[i])), swing = Math.max(0, -Math.cos(th));
            L.hip.rotation.x = lerp(L.hip.rotation.x, Math.sin(th) * amp, k);
            L.knee.rotation.x = lerp(L.knee.rotation.x, (L.front ? 1.1 : -.85) * swing * Math.min(1, amp * 2.6), k);
        });
        r.body.position.y = lerp(r.body.position.y, bound ? Math.max(0, Math.sin(TAU * d.cyc + 1.3)) * .32 : Math.abs(Math.sin(TAU * d.cyc * 2)) * .012 * amp, k);
        r.body.rotation.x = lerp(r.body.rotation.x, bound ? Math.sin(TAU * d.cyc) * .16 : (neckT > 1.5 ? .07 : 0), k);
        r.neck.rotation.x = lerp(r.neck.rotation.x, neckT + (bound ? Math.sin(TAU * d.cyc) * .12 : Math.sin(TAU * d.cyc * 2) * .04 * amp), Math.min(1, dt * 3));
        r.headP.rotation.x = lerp(r.headP.rotation.x, headT + (neckT > 1.5 ? Math.sin(elapsed * 5 + d.phase) * .05 : 0), Math.min(1, dt * 4));
        d.flick -= dt; if (d.flick < 0) d.flick = 1.5 + Math.random() * 5;
        r.tail.rotation.x = lerp(r.tail.rotation.x, d.state === 'flee' ? 2.4 : (d.flick < .25 ? .9 : .15), Math.min(1, dt * 10));
        d.ear -= dt; if (d.ear < 0) d.ear = .8 + Math.random() * 4;
        for (const s of [-1, 1]) { const e = d.mesh.userData['ear' + s]; e.rotation.y = lerp(e.rotation.y, s * (d.state === 'alert' ? -.1 : (d.ear < .2 && s > 0 ? .9 : .25)), Math.min(1, dt * 12)); }
    }

    function startHop(b, yaw, flee) {
        b.state = 'hop'; b.yaw = yaw; b.t = 0; b.flee = flee;
        b.dur = flee ? .26 + Math.random() * .06 : .32 + Math.random() * .1;
        b.dist = flee ? 2.1 + Math.random() * .8 : .35 + Math.random() * .35;
        b.lift = flee ? .3 + Math.random() * .1 : .07 + Math.random() * .05;
    }

    function update(dt, time) {
        elapsed = time || elapsed + dt;
        const player = getPlayerPos ? getPlayerPos() : null;
        const cam = getCamera ? getCamera() : null;

        // ---------- RAIN ----------
        if (RAIN_COUNT > 0) {
            if (cam) { rainGroup.position.x = cam.position.x; rainGroup.position.z = cam.position.z; }
            const arr = rainGeo.attributes.position.array;
            for (let i = 0; i < RAIN_COUNT; i++) {
                const ix = i * 6, fall = rainSpeeds[i] * dt;
                arr[ix + 1] -= fall; arr[ix + 4] -= fall;
                if (arr[ix + 4] < -1) seedDrop(i, false);
            }
            rainGeo.attributes.position.needsUpdate = true;
        }

        // ---------- HARES ----------
        for (const b of bunnies) {
            const m = b.mesh, r = b.rig;
            const pd = player ? Math.hypot(player.x - m.position.x, player.z - m.position.z) : 1e9;
            const away = player ? Math.atan2(m.position.x - player.x, m.position.z - player.z) : 0;
            if (b.state === 'hop') {
                b.t += dt / b.dur; const t = Math.min(1, b.t), st = b.dist * dt / b.dur;
                m.position.x += Math.sin(b.yaw) * st; m.position.z += Math.cos(b.yaw) * st;
                m.position.x = Math.max(bounds.x1, Math.min(bounds.x2, m.position.x)); m.position.z = Math.max(bounds.z1, Math.min(bounds.z2, m.position.z));
                turnTo(m, b.yaw, 14, dt); plant(m, .15);
                const a = Math.sin(Math.PI * t);
                r.body.position.y = a * b.lift;
                r.body.rotation.x = -Math.sin(TAU * t) * (b.flee ? .32 : .18);                // nose up on take-off, down on landing
                r.body.scale.z = 1 + a * (b.flee ? .28 : .12);                               // stretches out in the air
                for (const f of r.feet) f.rotation.x = a * (b.flee ? 1.2 : .6);              // hind feet kick back
                for (const s of [-1, 1]) m.userData['ear' + s].rotation.x = lerp(m.userData['ear' + s].rotation.x, b.flee ? -1.15 : -.4, Math.min(1, dt * 10));
                if (t >= 1) {
                    r.body.position.y = 0; r.body.rotation.x = 0; r.body.scale.z = 1; for (const f of r.feet) f.rotation.x = 0;
                    if (b.flee && --b.chain > 0) startHop(b, away + (Math.random() - .5) * 1.2, true);   // zig-zag escape
                    else { b.state = pd < 9 ? 'freeze' : 'feed'; b.timer = b.state === 'freeze' ? 2 + Math.random() * 4 : .6 + Math.random() * 3; }
                }
                continue;
            }
            b.timer -= dt;
            if (pd < 4.5) { b.chain = 4 + (Math.random() * 4 | 0); startHop(b, away + (Math.random() - .5) * .8, true); continue; }
            if (b.state === 'feed' && pd < 9) { b.state = 'freeze'; b.timer = 2 + Math.random() * 5; }
            const freeze = b.state === 'freeze';
            r.head.rotation.x = lerp(r.head.rotation.x, freeze ? -.15 : .45 + Math.sin(elapsed * 9 + b.phase) * .06 * (Math.sin(elapsed * .7 + b.phase) > 0 ? 1 : 0), Math.min(1, dt * 6));
            r.nose.scale.setScalar(freeze ? 1 : 1 + Math.max(0, Math.sin(elapsed * 22 + b.phase)) * .35);
            for (const s of [-1, 1]) { const e = m.userData['ear' + s]; e.rotation.x = lerp(e.rotation.x, freeze ? .05 : -.35 + Math.sin(elapsed * 1.3 + b.phase + s) * .15, Math.min(1, dt * 6)); }
            if (b.timer <= 0) {
                if (freeze) { b.state = 'feed'; b.timer = 1 + Math.random() * 3; }
                else startHop(b, m.rotation.y + (Math.random() - .5) * 1.6, false);
            }
        }

        // ---------- DEER ----------
        for (const d of deer) {
            const m = d.mesh;
            const pd = player ? Math.hypot(player.x - m.position.x, player.z - m.position.z) : 1e9;
            const away = player ? Math.atan2(m.position.x - player.x, m.position.z - player.z) : 0;
            d.timer -= dt; d.cool -= dt;
            if (d.state !== 'flee' && pd < 11) { d.state = 'flee'; d.timer = 4 + Math.random() * 2.5; d.fleeYaw = away + (Math.random() - .5) * .9; }
            else if ((d.state === 'graze' || d.state === 'walk') && pd < 24 && d.cool <= 0) { d.state = 'alert'; d.timer = 3 + Math.random() * 4; }
            let tsp = 0, neckT = .35, headT = 0;
            if (d.state === 'graze') {
                neckT = 2.1; headT = -.75;
                if (d.timer <= 0) { d.target.set(m.position.x + (Math.random() - .5) * 30, 0, m.position.z + (Math.random() - .5) * 30); d.state = 'walk'; }
            } else if (d.state === 'walk') {
                const dx = d.target.x - m.position.x, dz = d.target.z - m.position.z;
                tsp = d.walkSpeed; turnTo(m, Math.atan2(dx, dz), 1.2, dt);
                if (Math.hypot(dx, dz) < 1) { d.state = 'graze'; d.timer = 4 + Math.random() * 9; }
            } else if (d.state === 'alert') {
                neckT = -.25; headT = .12; turnTo(m, away + Math.PI, 1.6, dt);           // stares at you
                if (d.timer <= 0) {
                    d.cool = 8;
                    if (pd < 20) { d.state = 'walk'; d.target.set(m.position.x + Math.sin(away) * 25, 0, m.position.z + Math.cos(away) * 25); }
                    else { d.state = 'graze'; d.timer = 3 + Math.random() * 6; }
                }
            } else {
                tsp = d.timer > 1 ? 7.5 : 1.2; neckT = .55; headT = -.1;
                d.fleeYaw += angDiff(d.fleeYaw, away) * Math.min(1, dt * .8);
                turnTo(m, d.fleeYaw, 3, dt);
                if (d.timer <= 0) { d.state = 'walk'; d.cool = 10; d.target.set(m.position.x + Math.sin(away) * 20, 0, m.position.z + Math.cos(away) * 20); }
            }
            d.speed = lerp(d.speed, tsp, Math.min(1, dt * (tsp > d.speed ? 2.5 : 1.8)));
            m.position.x += Math.sin(m.rotation.y) * d.speed * dt; m.position.z += Math.cos(m.rotation.y) * d.speed * dt;
            if (m.position.x < bounds.x1 || m.position.x > bounds.x2 || m.position.z < bounds.z1 || m.position.z > bounds.z2) {
                m.position.x = Math.max(bounds.x1, Math.min(bounds.x2, m.position.x)); m.position.z = Math.max(bounds.z1, Math.min(bounds.z2, m.position.z));
                const home = Math.atan2((bounds.x1 + bounds.x2) / 2 - m.position.x, (bounds.z1 + bounds.z2) / 2 - m.position.z);
                d.fleeYaw = home; d.target.set(m.position.x + Math.sin(home) * 15, 0, m.position.z + Math.cos(home) * 15);
            }
            plant(m, .55);
            deerRig(d, dt, neckT, headT);
        }

        // ---------- BIRDS ----------
        for (const b of birds) {
            b.angle += b.w * dt;
            const m = b.mesh, x = b.cx + Math.cos(b.angle) * b.radius, z = b.cz + Math.sin(b.angle) * b.radius;
            const y = b.height + Math.sin(b.angle * 1.3 + b.phase) * 2;
            const dy = Math.cos(b.angle * 1.3 + b.phase) * 2.6 * b.w, v = Math.abs(b.w) * b.radius;
            m.position.set(x, y, z);
            m.rotation.y = Math.atan2(-Math.sin(b.angle) * Math.sign(b.w), Math.cos(b.angle) * Math.sign(b.w));
            m.rotation.x = -Math.atan2(dy, v) * .8;
            m.rotation.z = Math.sign(b.w) * Math.atan(b.w * b.w * b.radius / 9.8);           // banks into the turn
            b.glideT -= dt;
            if (b.glideT < 0) { b.gliding = !b.gliding; b.glideT = b.gliding ? (b.raven ? 2 + Math.random() * 3 : .4 + Math.random()) : (b.raven ? 1 + Math.random() * 1.5 : 2 + Math.random() * 3); }
            if (!b.gliding || dy > 1) b.ph += dt * b.flapHz * TAU;
            for (const w of m.userData.wings) {
                const f = b.gliding && dy <= 1 ? null : b.ph;
                w.inner.rotation.z = lerp(w.inner.rotation.z, w.s * (f === null ? .1 : Math.sin(f) * .55 + .08), Math.min(1, dt * (f === null ? 4 : 30)));
                w.mid.rotation.z = lerp(w.mid.rotation.z, w.s * (f === null ? -.04 : Math.sin(f - .7) * .4), Math.min(1, dt * (f === null ? 4 : 30)));
            }
        }
    }

    return { update, bunnies, deer, birds, rainGroup };
}

const wildlife = createCritterWorld(scene, {
    groundHeight: getTerrainHeight,
    getCamera: () => camera,
    getPlayerPos: () => new THREE.Vector3(player.x, player.fy, player.z),
    bounds: { x1: -45, z1: -45, x2: 55, z2: 55 },
    bunnyCount: 8,
    deerCount: 3,
    birdCount: 8,
    rainAmount: 0
});

/* =====================================================================
   MINING — the ground is a field of 0.25 m columns. Each column is a list
   of solid intervals [y0, y1, type] (0 = natural soil, 1 = loose dirt).
   Untouched columns are implicit (bedrock → terrain surface). A shovel
   stab carves a rounded scoop out of those intervals in any direction;
   loose dirt is laid down as smooth mounds that slump to their angle of
   repose. Edited 8 m regions are drawn by their own meshes: neighbouring
   surfaces within a hand-span are welded into smooth slopes, bigger steps
   become cut walls, and the heightmap is holed underneath.
   ===================================================================== */
const mine = (() => {
  const S = .25, RS = 8 / S, BOT = -60, TOL = .3, TA = terrainAPI, surfH = TA.surfH;
  const OXc = WOX / S, OZc = WOZ / S;
  const cols = new Map(), regions = new Map();
  const K = (a, b) => a + ',' + b;
  const ci = v => Math.floor(v / S);
  const natH = (ix, iz) => surfH((ix + .5) * S, (iz + .5) * S);
  const col = (ix, iz) => cols.get(K(ix, iz));
  const ivsOf = (ix, iz) => { const c = col(ix, iz); return c ? c.iv : [[BOT, natH(ix, iz), 0]]; };
  const isNatTop = (c, iv) => iv[2] === 0 && (!c || iv[1] === c.h);
  const regionOf = (ix, iz) => [Math.floor((ix - OXc) / RS), Math.floor((iz - OZc) / RS)];
  const inHouse = (x, z) => x > -.7 && x < 9.7 && z > -.7 && z < 7.7;
  const inShed = (x, z) => x > 9 && x < 11.9 && z > .1 && z < 4.8;
  let edits = 0;

  function editCol(ix, iz) {
    let c = col(ix, iz);
    if (!c) { const h = natH(ix, iz); c = { h, iv: [[BOT, h, 0]] }; cols.set(K(ix, iz), c); }
    return c;
  }
  function floorAt(x, z, y) {
    const c = col(ci(x), ci(z));
    if (!c) return surfH(x, z);
    let best = -Infinity;
    for (const v of c.iv) {
      const top = isNatTop(c, v) ? surfH(x, z) : v[1];
      if (v[0] < y - 1e-4 && top > y - 1e-4) return top;
      if (top <= y + 1e-4 && top > best) best = top;
    }
    return best;
  }
  function ceilAt(x, z, y) {
    const c = col(ci(x), ci(z)); if (!c) return Infinity;
    let best = Infinity; for (const v of c.iv) if (v[0] >= y - 1e-4 && v[0] < best) best = v[0];
    return best;
  }
  function solidAt(x, y, z) {
    const c = col(ci(x), ci(z));
    if (!c) return y < surfH(x, z) && y > BOT;
    for (const v of c.iv) if (y > v[0] && y < (isNatTop(c, v) ? surfH(x, z) : v[1])) return true;
    return false;
  }
  const active = (x, z) => regions.has(K(...regionOf(ci(x), ci(z))));
  function blockedCol(ix, iz) { const x = (ix + .5) * S, z = (iz + .5) * S; return inHouse(x, z) || inShed(x, z) || TA.treeNear(x, z, .3); }

  /* merge touching loose layers, drop loose layers that lost their support, discard dust-thin slivers */
  function tidy(c) {
    c.iv = c.iv.filter(v => v[1] - v[0] > .012).sort((p, q) => p[0] - q[0]);
    for (let i = 1; i < c.iv.length; i++) {
      const v = c.iv[i], under = c.iv[i - 1];
      if (v[2] === 1 && v[0] > under[1] + 1e-3) { const t = v[1] - v[0]; v[0] = under[1]; v[1] = under[1] + t; }
    }
    const m = [];
    for (const v of c.iv) { const p = m[m.length - 1]; if (p && v[0] <= p[1] + 1e-3 && (p[2] === v[2] || v[2] === 1 && p[2] === 1)) p[1] = Math.max(p[1], v[1]); else m.push(v); }
    c.iv = m;
  }

  /* carve a ball of radius r centred on (x, y, z); returns the volume of soil actually removed (m³) */
  function scoop(x, y, z, r) {
    let vol = 0; const hit = [];
    for (let iz = ci(z - r); iz <= ci(z + r); iz++) for (let ix = ci(x - r); ix <= ci(x + r); ix++) {
      const cx = (ix + .5) * S, cz = (iz + .5) * S, d = Math.hypot(cx - x, cz - z); if (d > r) continue;
      if (blockedCol(ix, iz)) continue;
      const hh = Math.sqrt(r * r - d * d), a = y - hh, b = y + hh, c = editCol(ix, iz), out = [];
      let took = 0;
      c.iv.forEach((v, i) => {
        if (v[1] <= a || v[0] >= b) { out.push(v); return; }
        took += Math.min(v[1], b) - Math.max(v[0], a);
        if (v[0] < a) out.push([v[0], a, v[2]]);
        if (v[1] > b && !(i === c.iv.length - 1 && v[1] - b < .07)) out.push([b, v[1], v[2]]);   // a crumb of topsoil over the scoop comes away too
        else if (v[1] > b) took += v[1] - b;
      });
      if (took > 0) { c.iv = out; tidy(c); vol += took * S * S; hit.push([ix, iz]); }
    }
    for (const [ix, iz] of hit) touch(ix, iz);
    if (hit.length) relax(ci(x), ci(z), Math.ceil(r / S) + 3);
    return vol;
  }

  /* lay a cone-shaped mound of `vol` m³ of loose dirt on whatever surface is under (x, z) below height y */
  function mound(x, z, y, vol) {
    const R = Math.max(.22, Math.cbrt(vol) * 1.1), list = []; let wsum = 0;
    for (let iz = ci(z - R); iz <= ci(z + R); iz++) for (let ix = ci(x - R); ix <= ci(x + R); ix++) {
      const cx = (ix + .5) * S, cz = (iz + .5) * S, d = Math.hypot(cx - x, cz - z), w = 1 - d / R;
      if (w <= 0 || blockedCol(ix, iz)) continue;
      list.push([ix, iz, w]); wsum += w;
    }
    if (!wsum) return false;
    for (const [ix, iz, w] of list) addOn(ix, iz, y, vol * w / (wsum * S * S));
    relax(ci(x), ci(z), Math.ceil(R / S) + 4);
    return true;
  }
  /* add a loose layer of thickness th on top of the surface found below height y in a column */
  function addOn(ix, iz, y, th) {
    const c = editCol(ix, iz), cx = (ix + .5) * S, cz = (iz + .5) * S, at = floorAt(cx, cz, y + .05);
    for (const v of c.iv) if (v[2] === 0 && Math.abs(v[1] - at) < 1e-4) v[2] = 2;   // natural ground now buried under spoil
    c.iv.push([at, at + th, 1]); tidy(c); touch(ix, iz);
  }
  /* angle of repose (~38°): loose tops steeper than that against a neighbour shed material downhill */
  function relax(ix0, iz0, rad) {
    const MAXD = S * .78;
    for (let pass = 0; pass < 8; pass++) {
      let moved = false;

  const i = list.findIndex(t => t[0] === inv.tool && (t[0] !== 'shovel' || t[1] === inv.mode));
  const n = list[(i + 1) % list.length]; setTool(n[0], n[1]);
}

/* ---- the bag: pick what's in your hands, and how you use it ---- */
let bagOpen = false;
function renderBag() {
  const el = $('bagItems'); if (!el) return;
  const items = [['hands', null, 'Bare hands', 'Pick things up, push carts.']];
  if (inv.shovel) { items.push(['shovel', 'dig', 'Shovel — dig', 'Hold to keep digging. Each shovelful goes in the sack.']); items.push(['shovel', 'place', 'Shovel — place dirt', inv.dirt.length + ' shovelful' + (inv.dirt.length === 1 ? '' : 's') + ' in the sack. Hold to build a pile where you aim.']); }
  if (inv.axe) items.push(['axe', null, 'Felling axe', 'Hold to chop. Fell a tree, then chop the trunk into logs.']);
  el.innerHTML = '';
  for (const [t, m, name, sub] of items) {
    const b = document.createElement('button'); b.type = 'button';
    b.className = 'bagI' + (inv.tool === t && (!m || inv.mode === m) ? ' on' : '');
    b.innerHTML = '<b></b><span></span>'; b.firstChild.textContent = name; b.lastChild.textContent = sub;
    b.addEventListener('click', () => { setTool(t, m); closeBag(); });
    el.appendChild(b);
  }
  $('bagCount').textContent = 'Logs ' + inv.logs + '/4 · Sticks ' + inv.sticks + '/20 · Dirt ' + inv.dirt.length + '/' + DIRT_MAX + ' · Carts need 3 logs + 4 sticks';
}
function openBag() { if (!started || paused) return; bagOpen = window.__bag = true; holdUse = false; renderBag(); $('bag').classList.add('show'); if (document.pointerLockElement) document.exitPointerLock(); }
function closeBag() { bagOpen = window.__bag = false; $('bag').classList.remove('show'); if (!isTouch && !noLock) lockPointer(); }
window.__closeBag = closeBag;

/* ---- hold to keep working ---- */
let holdUse = false;
addEventListener('mouseup', e => { if (e.button === 0) holdUse = false; });
cvs.addEventListener('mousedown', e => { if (e.button === 0 && started && !paused && locked && !bagOpen) holdUse = true; });
{ const b = $('bUse'); const up = () => { holdUse = false; };
  b.addEventListener('pointerdown', e => { e.preventDefault(); if (!paused && !bagOpen) { holdUse = true; primary(); } });
  b.addEventListener('pointerup', up); b.addEventListener('pointerleave', up); b.addEventListener('pointercancel', up); }
function holdTick() {
  if (!holdUse || !started || paused || bagOpen || cine.on || focus) return;
  if (inv.tool === 'axe' ? !axeAnim : (inv.tool === 'shovel' && !vmAnim)) useTool();
}

/* ---- place-dirt aim marker: a dark ring on the ground where the next shovelful will land ---- */
const ghost = new THREE.Mesh(new THREE.RingGeometry(.16, .26, 10), new THREE.MeshBasicMaterial({ color: C('#2a1f15'), transparent: true, opacity: .55, depthWrite: false, side: THREE.DoubleSide }));
ghost.rotation.x = -PI / 2; ghost.visible = false; O.add(ghost);
function updateGhost() {
  ghost.visible = false;
  if (inv.tool !== 'shovel' || inv.mode !== 'place' || !inv.dirt.length || bagOpen) return;
  camera.getWorldPosition(eyeV); camera.getWorldDirection(dirV3);
  const h = mine.pick(eyeV, dirV3, 3.2); if (!h) return;
  ghost.position.set(h.px, ground2(h.px, h.pz, h.py + .05) + .03, h.pz); ghost.visible = true;
}
function updateAxe(dt) {
  if (!avm.visible) return;
  const b = Math.sin(player.bob) * .014, s = Math.sin(player.bob * .5) * .01;
  let o = [0, 0, 0, 0, 0, 0];
  if (axeAnim) {
    axeAnim.t += dt; const t = Math.min(1, axeAnim.t / AXE_SWING.dur), K = AXE_SWING.keys;
    let i = 0; while (i < K.length - 2 && t > K[i + 1][0]) i++;
    const a = K[i], c = K[i + 1], u = (t - a[0]) / (c[0] - a[0]), e = i === 1 ? u * u * u : u * u * (3 - 2 * u);   // the downswing accelerates
    o = [1, 2, 3, 4, 5, 6].map(j => a[j] + (c[j] - a[j]) * e);
    if (!axeAnim.fired && t >= AXE_SWING.hit) { axeAnim.fired = true; axeAnim.onHit(); }
    if (t >= 1) axeAnim = null;
  }
  avm.position.set(AXE_REST.p[0] + o[0] + s, AXE_REST.p[1] + o[1] + b, AXE_REST.p[2] + o[2]);
  avm.rotation.set(AXE_REST.r[0] + o[3], AXE_REST.r[1] + o[4], AXE_REST.r[2] + o[5]);
}
addEventListener('keydown', e => {
  if (!started || paused) return;
  if (e.code === 'KeyI' || e.code === 'Tab') { e.preventDefault(); if (bagOpen) closeBag(); else openBag(); }
});
$('bBag').addEventListener('click', () => { if (bagOpen) closeBag(); else openBag(); });
$('bagClose').addEventListener('click', () => closeBag());

/* ================= opening shot: first time out of the front door ================= */
const cine = { on: false, t: 0, done: false };
function startCine() { if (cine.done) return; cine.done = cine.on = true; cine.t = 0; $('lbT').style.height = $('lbB').style.height = '11%'; }
function endCine() { cine.on = false; $('lbT').style.height = $('lbB').style.height = '0'; scene.fog.density = .032; }
const ease = t => t * t * (3 - 2 * t);
function cineCam(dt) {
  cine.t += dt;
  const H = new THREE.Vector3(4.5, 1.2, 3.5), t = cine.t, eye = new THREE.Vector3(player.x, player.fy + player.eye, player.z);
  const fwd = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
  const a0 = Math.atan2(eye.z - H.z, eye.x - H.x);
  const orbit = k => { const a = a0 + .35 + ease(k) * 3.9, r = 18 + 10 * Math.sin(k * PI), y = 16 - 5 * k; return new THREE.Vector3(H.x + Math.cos(a) * r, H.y + y, H.z + Math.sin(a) * r); };
  let pos, look;
  if (t < 3) { const k = ease(t / 3), A = orbit(0); pos = eye.clone().lerp(A, k); pos.y += Math.sin(k * PI) * 2; look = eye.clone().add(fwd.clone().multiplyScalar(6)).lerp(H, k); }
  else if (t < 9) { const k = (t - 3) / 6; pos = orbit(k); look = H.clone().add(new THREE.Vector3(Math.sin(k * 5) * 3, 0, Math.cos(k * 4) * 3)); }
  else { const k = ease(Math.min(1, (t - 9) / 2.6)), B = orbit(1); pos = B.lerp(eye, k); look = H.clone().lerp(eye.clone().add(new THREE.Vector3(-Math.sin(player.yaw) * Math.cos(player.pitch), Math.sin(player.pitch), -Math.cos(player.yaw) * Math.cos(player.pitch)).multiplyScalar(6)), k); }
  scene.fog.density = .032 - .014 * Math.sin(Math.min(1, t / 11.6) * PI);
  camera.position.copy(pos); camera.lookAt(look);
  if (t > 11.6) endCine();
}
addEventListener('keydown', e => {
  if (!started || paused) return;
  if (cine.on && cine.t > 1) { endCine(); return; }
  if (e.code === 'KeyQ') toolSwitch();
  if (e.code === 'KeyB') buildCart();
  if (e.code === 'KeyR') tipNearest();
  if (e.code === 'KeyG') dropDirt();
});
cvs.addEventListener('contextmenu', e => e.preventDefault());
cvs.addEventListener('mousedown', e => { if (e.button === 2 && started && !paused && locked) dropDirt(); });
$('bTool').addEventListener('click', () => { if (!paused) toolSwitch(); });
$('bTip').addEventListener('click', () => { if (!paused) tipNearest(); });
$('bBuild').addEventListener('click', () => { if (!paused) buildCart(); });
$('bDrop').addEventListener('click', () => { if (!paused) dropDirt(); });
hud();

/* ================= loop ================= */
scene.updateMatrixWorld(true);
doors.forEach(updDoorBox);
renderer.shadowMap.needsUpdate = true;
let last = performance.now(), time = 0, frameN = 0, shadowDirty = false, shadowT = 0;
let flick = { on: true, t: 2 }, kflick = 0, lastSec = -1;
const fridgePos = new THREE.Vector2(.42, 3.78), clockPos = new THREE.Vector2(5.05, 4.12), tvPos = new THREE.Vector2(8.3, .3);

function update(dt) {
  let f = 0, s = 0;
  if (keys.KeyW || keys.ArrowUp) f += 1; if (keys.KeyS || keys.ArrowDown) f -= 1;
  if (keys.KeyD || keys.ArrowRight) s += 1; if (keys.KeyA || keys.ArrowLeft) s -= 1;
  f -= touch.my; s += touch.mx;
  const len = Math.hypot(f, s); if (len > 1) { f /= len; s /= len; }
  const base = (player.crouch ? 1.1 : 2.2) * paceMul * (1 - inv.logs * .07 - inv.dirt.length * .03);   // logs are heavy
  const sp = (keys.ShiftLeft || keys.ShiftRight) && !player.crouch ? 3.8 * paceMul : base;
  const sy = Math.sin(player.yaw), cy = Math.cos(player.yaw);
  const tx = (-sy * f + cy * s) * sp, tz = (-cy * f - sy * s) * sp;
  const k = Math.min(1, dt * 10); player.vx += (tx - player.vx) * k; player.vz += (tz - player.vz) * k;
  let nx = player.x + player.vx * dt, nz = player.z + player.vz * dt;
  const rad = player.crouch ? .2 : .24;
  [nx, nz] = collide(nx, nz, rad); [nx, nz] = collide(nx, nz, rad);
  /* dug ground: soil higher than a step is a wall, and you need headroom to stand (or crouch) */
  const hgt = player.crouch ? 1.15 : 1.75;
  const blocked = (x, z) => { for (const [ox, oz] of [[rad, rad], [-rad, rad], [rad, -rad], [-rad, -rad]]) { const px = x + ox, pz = z + oz; if (!mine.active(px, pz) || mine.inHouse(px, pz)) continue;
    const f = mine.ground(px, pz, player.fy); if (f > player.fy + .45 || mine.ceilAt(px, pz, f + .05) - Math.max(f, player.fy) < hgt) return true; } return false; };
  if (mine.edits && blocked(nx, nz)) { if (!blocked(nx, player.z)) nz = player.z; else if (!blocked(player.x, nz)) nx = player.x; else { nx = player.x; nz = player.z; } }
  const moved = Math.hypot(nx - player.x, nz - player.z);
  player.x = nx; player.z = nz;
  player.gy = mine.ground(nx, nz, player.fy);
  streamWorld(nx, nz, false);
  if (player.gy < player.fy - .3 || player.vy) {             // dropping into a hole: real gravity
    player.vy = (player.vy || 0) - 9.81 * dt; player.fy += player.vy * dt;
    if (player.fy <= player.gy) { if (player.vy < -6.5) { say('You land hard. Your knees ring.'); sfx.step(); } player.fy = player.gy; player.vy = 0; }
  } else player.fy += (player.gy - player.fy) * Math.min(1, dt * 14);
  if ((player.z > 7.6 || player.x < -.6 || player.x > 9.6 || player.z < -.6) && !window.__out) { window.__out = 1; startCine(); setTimeout(() => say('Outside. Snow squeaks underfoot. The flat sits very still behind you.'), 12000); }
  const before = Math.floor(player.bob / PI); player.bob += moved * (player.crouch ? 3.8 : 5.2);
  if (Math.floor(player.bob / PI) !== before) sfx.step();
  const targetEye = player.crouch ? 1.05 : 1.6;
  player.eye += (targetEye - player.eye) * Math.min(1, dt * 10);
}

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000); last = now; time += dt; frameN++;
  if (started && !paused) { if (!cine.on) update(dt); wildlife.update(dt, time); updateCarts(dt); updateClods(dt); }
  const bobAmp = player.crouch ? .014 : .028;
  camera.position.set(player.x, player.fy + player.eye + Math.sin(player.bob) * bobAmp, player.z);
  camera.rotation.set(player.pitch + Math.sin(time * 70) * camShake, player.yaw, Math.sin(player.bob * .5) * (player.crouch ? .002 : .004));

  for (const D of doors) if (D.t !== D.target) {
    D.t = Math.max(0, Math.min(1, D.t + Math.sign(D.target - D.t) * dt * 1.6));
    const e = D.t * D.t * (3 - 2 * D.t); D.pv.rotation.y = D.closed + (D.open - D.closed) * e;
    updDoorBox(D); shadowDirty = true; if (D.t === D.target) shadowT = 1;
  }
  shadowT += dt;
  if (shadowDirty && shadowT > .12) { renderer.shadowMap.needsUpdate = true; shadowDirty = false; shadowT = 0; }

  if (hallL.on) {
    flick.t -= dt; if (flick.t < 0) { flick.on = !flick.on; flick.t = flick.on ? RR(.6, 7) : RR(.03, .16); }
    const v = flick.on ? .92 + Math.random() * .08 : RR(.04, .3);
    hallL.light.intensity = hallL.base * v; hallL.glow[0].emissiveIntensity = hallL.glow[0].userData.ei * v;
  }
  if (kitL.on) { kflick -= dt; if (kflick < 0) kflick = RR(4, 14); const v = kflick < .25 ? (Math.random() < .5 ? .2 : 1) : 1;
    kitL.light.intensity = kitL.base * v; kitL.glow[0].emissiveIntensity = kitL.glow[0].userData.ei * v; }

  if (tvOn && frameN % 2 === 0) {
    const d = tvCtx.createImageData(96, 72); for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
    tvCtx.putImageData(d, 0, 0); tvTex.needsUpdate = true; tvLight.intensity = .5 + Math.random() * .35;
  }
  const sec = Math.floor(time);
  if (sec !== lastSec) { lastSec = sec; clock.sh.rotation.z = -((sec % 2 ? 21 : 22) / 60) * PI * 2;
    const dc = clockPos.distanceTo(new THREE.Vector2(player.x, player.z)); if (started && dc < 7 && player.gy > -.8) sfx.tick(1 - dc / 7); }

  if (sfx.ctx) {
    const pp = new THREE.Vector2(player.x, player.z), up = player.gy > -.8 ? 1 : 0;
    sfx.fridge.gain.value = .05 * up * Math.max(0, 1 - pp.distanceTo(fridgePos) / 7);
    sfx.tv.gain.value = tvOn ? .035 * up * Math.max(0, 1 - pp.distanceTo(tvPos) / 7) : 0;
  }
  if (sayT > 0) { sayT -= dt; if (sayT <= 0) $('say').style.opacity = 0; }
  if (started && !paused && frameN % 4 === 0) scan();

  if (cine.on) cineCam(dt);
  updateViewmodel(dt); updateAxe(dt); updateGhost(); updateUnder(dt);
  if (started && !paused) { updateFallen(dt); holdTick(); }
  sky.position.copy(camera.position);
  if (!paused) snowfall(dt, time, camera);
  if (started && !paused) snowAcc.value = Math.min(.9, snowAcc.value + dt / 540);   // ground whitens over ~8 minutes
  if (cozy) cozy(dt, time);
  cloudG.rotation.y += dt * .004; cloudG.position.x = player.x; cloudG.position.z = player.z;

  post.uniforms.time.value = time;
  renderer.setRenderTarget(rt); renderer.render(scene, camera);
  renderer.setRenderTarget(null); renderer.render(postScene, postCam);
}
requestAnimationFrame(frame);
})();
</script>
