<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Studio — WebXR Office</title>
	<style>
		html, body { margin: 0; height: 100%; background: #0b0b0c; overflow: hidden; font-family: system-ui, sans-serif; }
		canvas { display: block; }
		#overlay {
			position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
			background: rgba(10,10,12,.55); color: #f2f2f2; z-index: 5; text-align: center;
		}
		#overlay .card { max-width: 440px; padding: 28px 32px; background: rgba(20,20,22,.85); border-radius: 14px; line-height: 1.5; }
		#overlay h1 { font-size: 18px; margin: 0 0 10px; font-weight: 600; letter-spacing: .2px; }
		#overlay p { font-size: 13px; margin: 6px 0; color: #c9c9cc; }
		#overlay kbd { background: #333; padding: 1px 6px; border-radius: 4px; font-size: 12px; }
		#overlay.hidden { display: none; }
		#loading { position: fixed; left: 16px; bottom: 14px; color: #aaa; font-size: 12px; z-index: 6; }
		#crosshair { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%;
			background: rgba(255,255,255,.8); box-shadow: 0 0 0 1px rgba(0,0,0,.35); z-index: 4; pointer-events: none; display: none; }
		#crosshair.on { display: block; }
		#crosshair.hot { background: #6cf; }
		#vr-elsewhere { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 6;
		padding: 10px 14px; border-radius: 999px; background: rgba(20, 20, 22, 0.86); color: #f2f2f2; font-size: 13px; text-decoration: none;
		border: 1px solid rgba(255, 255, 255, 0.25); max-width: calc(100% - 32px); }
	#vr-elsewhere:hover, #vr-elsewhere:focus-visible { border-color: #6cc4ff; outline: none; }
</style>
</head>
<body>
	<div id="overlay"><div class="card">
		<h1>Studio</h1>
		<p>Click to look around.</p>
		<p><kbd>W A S D</kbd> walk &nbsp; <kbd>Mouse</kbd> look &nbsp; <kbd>E</kbd>/<kbd>click</kbd> grab &amp; use</p>
		<p>Click the monitor to use the computer. <kbd>Esc</kbd> leaves the computer.</p>
		<p>Use the VR button for headset mode.</p>
	</div></div>
	<div id="crosshair"></div>
	<div id="loading">Loading…</div>
	<script type="module" src="/src/main.ts"></script>
</body>
</html>
