<!doctype html><html><head><meta charset="utf-8"><title>Multiview test</title>
<script type="importmap">{ "imports": { "three": "../vendor/three/build/three.module.js" } }</script></head>
<body style="margin:0;background:#222">
<script type="module">
import * as THREE from 'three';
import { mvCompare } from './mvtest.js';
import { setupMirrors } from '../../world/src/mirrors.js';
const W = 320, H = 320;
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(W, H); renderer.shadowMap.enabled = true; renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x203040); scene.fog = new THREE.Fog(0x203040, 4, 30);
const env = new THREE.Scene(); env.background = new THREE.Color(0x8899aa);
const sky = new THREE.Mesh(new THREE.SphereGeometry(5, 16, 8), new THREE.MeshBasicMaterial({ side: THREE.BackSide, vertexColors: false, color: 0x445566 })); env.add(sky);
const lamp = new THREE.Mesh(new THREE.BoxGeometry(1, 0.2, 1), new THREE.MeshBasicMaterial({ color: 0xffffff })); lamp.position.set(0, 3, 0); env.add(lamp);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(env).texture;
const dl = new THREE.DirectionalLight(0xffeedd, 2); dl.position.set(3, 5, 2); dl.castShadow = true; scene.add(dl);
const pl = new THREE.PointLight(0xff8844, 6, 8); pl.position.set(-1.2, 1.2, 0.8); scene.add(pl);
const sl = new THREE.SpotLight(0x88aaff, 20, 10, 0.5, 0.4); sl.position.set(1.5, 2.5, 1.5); sl.castShadow = true; scene.add(sl);
scene.add(new THREE.HemisphereLight(0x8899ff, 0x332211, 0.4));
const floor = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.MeshStandardMaterial({ color: 0x777777, roughness: 0.3, metalness: 0.1 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const m1 = new THREE.Mesh(new THREE.SphereGeometry(0.4, 32, 16), new THREE.MeshPhysicalMaterial({ color: 0xaa2222, roughness: 0.15, clearcoat: 1, clearcoatRoughness: 0.05, metalness: 0.2 }));
m1.position.set(-0.5, 0.4, -1); m1.castShadow = true; scene.add(m1);
const m2 = new THREE.Mesh(new THREE.TorusKnotGeometry(0.25, 0.08, 96, 12), new THREE.MeshPhongMaterial({ color: 0x22aa44, shininess: 80 }));
m2.position.set(0.6, 0.5, -1.2); m2.castShadow = true; scene.add(m2);
const inst = new THREE.InstancedMesh(new THREE.BoxGeometry(0.15, 0.15, 0.15), new THREE.MeshStandardMaterial({ color: 0x3366cc, roughness: 0.5 }), 20);
for (let i = 0; i < 20; i++) inst.setMatrixAt(i, new THREE.Matrix4().makeTranslation(-1.5 + (i % 5) * 0.3, 0.08, -2 - Math.floor(i / 5) * 0.3));
inst.castShadow = true; scene.add(inst);
const bm = new THREE.BatchedMesh(4, 2000, 6000, new THREE.MeshStandardMaterial({ color: 0xcccc33, roughness: 0.4, metalness: 0.6 }));
const g1 = bm.addGeometry(new THREE.BoxGeometry(0.2, 0.4, 0.2)), g2 = bm.addGeometry(new THREE.SphereGeometry(0.15, 16, 8));
for (let i = 0; i < 4; i++) { const id = bm.addInstance(i % 2 ? g1 : g2); bm.setMatrixAt(id, new THREE.Matrix4().makeTranslation(1.2 + i * 0.25, 0.2, -2.2)); }
scene.add(bm);
const sh = new THREE.ShaderMaterial({ vertexShader: 'varying vec3 vW; void main(){ vec4 w = modelMatrix*vec4(position,1.0); vW = w.xyz; gl_Position = projectionMatrix*viewMatrix*w; }',
  fragmentShader: 'varying vec3 vW; void main(){ vec3 v = normalize(cameraPosition - vW); gl_FragColor = vec4(0.5+0.5*v, 1.0); }' });
const m3 = new THREE.Mesh(new THREE.IcosahedronGeometry(0.25, 2), sh); m3.position.set(0, 0.9, -1.6); scene.add(m3);
const sp = new THREE.Sprite(new THREE.SpriteMaterial({ color: 0xffaa00 })); sp.position.set(-1, 1.4, -1.8); sp.scale.set(0.2, 0.2, 1); scene.add(sp);
const mirMat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.05, metalness: 1 });
mirMat.userData.mirror = { p: [0, 1, -2.6], n: [0, 0, 1] };
const mir = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 1.6), mirMat); mir.position.set(0, 1, -2.6); scene.add(mir);
const mirTick = setupMirrors(scene, renderer, {}, [mir], { cubes: false, range: 8, vrPx: 256 });
const eyes = [0, 1].map((i) => { const c = new THREE.PerspectiveCamera(80, 1, 0.05, 50); c.position.set(i ? 0.032 : -0.032, 1.1, 0.5); c.lookAt(i ? 0.032 : -0.032, 0.5, -1.5); c.layers.enable(i + 1); return c; });
window.result = (() => { try { const r = mvCompare(THREE, renderer, scene, eyes, W, H, (arr) => { renderer.xr.isMultiview = true; mirTick(arr); }); window.imgs = [r.px[0], r.px[1], r.ref[0], r.ref[1]].map((b) => Array.from(b)); delete r.px; delete r.ref; return r; } catch (e) { return { exception: String(e.stack || e) }; } })();
</script></body></html>
